# =============================================================================
# Deploy do portfólio no VPS (aanschau.tech)
#
# 1. build: gera a imagem e publica no GHCR (privado) com as tags
#    sha-<12> e latest. As VITE_* vêm dos secrets e são embutidas no bundle
#    (ficam públicas no JS — ver Dockerfile).
# 2. deploy: entra por SSH no VPS com uma chave restrita (forced command
#    /opt/portfolio/ssh-gate-portfolio.sh) e roda `deploy sha-<12>`.
#    Só acontece se a variável DEPLOY_ENABLED do environment `production`
#    for `true`; senão o job termina com um aviso.
#
# Environment `production` (Settings → Environments):
#   variables: DEPLOY_ENABLED=true
#   secrets:   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
# Secrets do repositório (build): VITE_APP_TELEGRAM_TOKEN, VITE_APP_CHAT_ID,
#   VITE_APP_FORMSPREE_ENDPOINT
# =============================================================================
name: Deploy (VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/adrianoanschau/portfolio

jobs:
  build:
    name: Build e publicação da imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag da imagem
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_APP_TELEGRAM_TOKEN=${{ secrets.VITE_APP_TELEGRAM_TOKEN }}
            VITE_APP_CHAT_ID=${{ secrets.VITE_APP_CHAT_ID }}
            VITE_APP_FORMSPREE_ENDPOINT=${{ secrets.VITE_APP_FORMSPREE_ENDPOINT }}
          cache-from: type=gha,scope=portfolio
          cache-to: type=gha,mode=max,scope=portfolio

  deploy:
    name: Deploy no VPS
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aanschau.tech
    steps:
      # DEPLOY_ENABLED é variável do environment: o guard precisa ser em
      # step (em `jobs.<id>.if` ela ainda não existe).
      - name: Confere se o deploy está habilitado
        id: guard
        run: |
          if [ "${{ vars.DEPLOY_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_ENABLED não é true no environment production — deploy pulado."
          fi

      - name: Configura SSH
        if: steps.guard.outputs.enabled == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy (no VPS)
        if: steps.guard.outputs.enabled == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${VPS_USER}@${VPS_HOST}" "deploy ${TAG}"

      - name: Verificação pública
        if: steps.guard.outputs.enabled == 'true'
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://aanschau.tech/healthz
          code="$(curl -s -o /dev/null -w '%{http_code}' https://www.aanschau.tech/)"
          [ "$code" = "301" ] || { echo "::error::www.aanschau.tech devolveu $code (esperado 301)"; exit 1; }
          echo "aanschau.tech OK"
