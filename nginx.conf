# =============================================================================
# nginx.conf — servidor do portfólio (copiado para /etc/nginx/conf.d/default.conf)
#
# Fica atrás do Caddy (TLS, HSTS, nosniff, Referrer-Policy e compressão zstd
# ficam lá). Aqui: arquivos estáticos, cache e fallback de SPA.
# =============================================================================

# IP real do visitante nos logs (o Caddy envia X-Forwarded-For; as redes
# docker ficam em 172.16.0.0/12 e 10.0.0.0/8 / 192.168.0.0/16).
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    # Redirecionamentos internos relativos (o host/porta reais são do Caddy).
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # Healthcheck do Docker/Compose (não aparece no access log).
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Arquivos do Vite com hash no nome: cache de 1 ano, imutável.
    # Arquivo inexistente -> 404 (nunca devolve o index.html no lugar de JS).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html sempre revalidado (é ele que aponta para os assets novos).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Demais arquivos de public/ (imagens etc.): 1 dia. Qualquer outra rota cai
    # no index.html (fallback de SPA).
    location / {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri $uri/ /index.html;
    }
}
